# Safety Gate Configuration
files: 
  sensitive_species:
    path: "data/sensitive_species.csv"

# Source connection
connection:
  dbhostname:
  port:
  server:
  dbname:
  password:
  schema:
  table:
  # call in the db connection file

destination:
  # UI database destination
    dbhostname:
    port:
    server:
    dbname:
    password:
    schema: public
    table: occurrence_public

load:
  # pipeline can perform incremental updates if true 
  incremental_check: true

source:
  mode: "csv"

  # For "csv" mode
  records_path: "../data/varied_sample.csv"     
  dictionary_path: "../data/full_dictionary.csv"

  # For "database" - BRERC: replace with your real table/view names
  records_query: "SELECT * FROM your_source_table"
  dictionary_query: "SELECT * FROM your_dictionary_table"

columns:
  species_number: species_no
  nbn_number: nbn_number
  verified: verified
  eastings: eastings
  northings: northings
  record_date: date_of_record

reconciliation:
  hash_columns:
    - scientific_name
    - abundance
    - sex_stage
    - record_type
    - vitality
    - verified
    - eastings
    - northings
  chunk_size: 5000

generalisation:
  
  d0_floor_m: 100 
  default_sensitive_resolution_m: 1000

aggregation:
  suppression_threshold: 2 
  cell_size_m: 1000

species_resolutions: {}

verified_values:
  accepted:
    - "Accepted - correct"
    - "Accepted - considered correct"
    - "Accepted"
  legacy:
    - "BRERC"

flagged_record_types:
  - trapped at actinic light
  - trapped at light
  - trapped at mercury vapour light
  - night roost
  - tagged night roost
  - plant count
  - maternity roost
  - flower count
  - photographed
  - summer roost 
  - hibernation 
  - daylight site visit 
  - day roost
  - rosette count
    # for bat roost and plant
  - field record
  - field record (bat roost sensitive record)
  - field record (plant sensitive record)
  - bat detector 
  - box survey 
  - hibernation roost
  - earth 
  - droppings 
  - handled 
  - burrow 
  - pre-parturition roost
  - netted 
  - box survey 
  - breeding
  - roost 
  - emergence count
  - tagged day roost 
  - grounded
  - possibly breeding 
  - nest
  - field record 
  - holt
  - bedding
  - bat roost
  - lie-up
  - DNA or eDNA testing
  - AI or programme analysis
  - Beaver Lodge
  - Acoustic audio recording
  - Acoustic audio record
  - found dead
  - found dead
  - dam
  - gnawed timber
