# =============================================================================
# ARCHIVED LEGACY DEMONSTRATION — NOT A SUPPORTED DEPLOYMENT OR ACCEPTANCE PATH.
#
# This file provisions the obsolete B6 sample schema, the old public.* store,
# an unpinned Martin image, development credentials and a Caddy placeholder.
# It neither creates nor publishes the release-scoped serve.* views used by the
# current API. It must not receive real BRERC data, credentials or production
# configuration. See docs/PUBLIC_SERVING_ARCHITECTURE.md for the supported v1
# serving boundary and deploy/production/ for the Linux serving examples.
#
# Every service is behind the explicit `legacy-obsolete` profile so a normal
# `docker compose up` selects no service and cannot be mistaken for a working
# dashboard. The profile remains solely to inspect the historical scaffold.
# =============================================================================

name: brerc-dashboard

services:
  db:
    profiles: ["legacy-obsolete"]
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: brerc_ui
      # Used by the init script to set the read-only role's password.
      RO_PASSWORD: ${RO_PASSWORD:-brerc_ro_2026}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Init scripts run ONCE on first startup, in filename order. The numeric
      # prefixes force the correct order: schema -> B0 -> sample data -> tiles
      # -> set the read-only role's password.
      - ./db/b6_schema.sql:/docker-entrypoint-initdb.d/01_b6_schema.sql:ro
      - ./db/b0_staging_setup.sql:/docker-entrypoint-initdb.d/02_b0.sql:ro
      - ./db/b6_sample_data.sql:/docker-entrypoint-initdb.d/03_b6_sample_data.sql:ro
      - ./db/b7_tiles.sql:/docker-entrypoint-initdb.d/04_b7_tiles.sql:ro
      - ./db/docker/99_set_ro_password.sh:/docker-entrypoint-initdb.d/99_set_ro_password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brerc_ui"]
      interval: 10s
      timeout: 5s
      retries: 5

  martin:
    profiles: ["legacy-obsolete"]
    image: ghcr.io/maplibre/martin:latest
    # Connects as the READ-ONLY role, so it can only ever serve the safe
    # function + views — never the raw tables (matches the B7 hardening).
    environment:
      DATABASE_URL: postgresql://brerc_api_ro:${RO_PASSWORD:-brerc_ro_2026}@db:5432/brerc_ui
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: ["legacy-obsolete"]
    build: ./api
    environment:
      # The legacy scaffold must never select the production API contract.
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://brerc_api_ro:${RO_PASSWORD:-brerc_ro_2026}@db:5432/brerc_ui
      # Same-origin through the proxy, so this is the origin the browser uses.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # Species photos + descriptions (B8). Off unless you set both of these in
      # a .env next to this file — SPECIES_INFO_CONTACT must be a real address.
      SPECIES_INFO_ENABLED: ${SPECIES_INFO_ENABLED:-false}
      SPECIES_INFO_CONTACT: ${SPECIES_INFO_CONTACT:-}
      SPECIES_INFO_CACHE_PATH: /app/.cache/species_info.sqlite3
    volumes:
      # Keeps the licence/description cache across restarts, so a redeploy does
      # not re-hit iNaturalist/GBIF/Wikipedia for every species again.
      - api_cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy

  proxy:
    profiles: ["legacy-obsolete"]
    image: caddy:2
    ports:
      - "8080:80"          # the ONE public entrypoint
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - martin

volumes:
  db_data:
  api_cache:
