name: Manual loader scale acceptance

on:
  workflow_dispatch:
    inputs:
      expected_git_sha:
        description: Exact protected-main loader/store merge SHA to test
        required: true
        type: string
      confirm:
        description: Type RUN_EXACTLY_5000000_SYNTHETIC_ROWS to accept the cost
        required: true
        type: string
      max_total_seconds:
        description: Maximum combined failed and successful loader runtime
        required: true
        type: string
      max_finalize_seconds:
        description: Maximum duration of either database finalisation phase
        required: true
        type: string
      max_activate_seconds:
        description: Maximum atomic activation duration
        required: true
        type: string
      max_cleanup_seconds:
        description: Maximum pending-candidate purge duration
        required: true
        type: string
      max_rss_mib:
        description: Maximum loader-process peak RSS in MiB
        required: true
        type: string
      max_source_temp_mib:
        description: Maximum source PostgreSQL temporary bytes in MiB
        required: true
        type: string
      max_target_temp_mib:
        description: Maximum target PostgreSQL temporary bytes in MiB
        required: true
        type: string
      max_target_wal_mib:
        description: Maximum target WAL generated by both loader runs in MiB
        required: true
        type: string
      max_target_db_growth_mib:
        description: Maximum observed target database growth in MiB
        required: true
        type: string
      min_free_disk_mib:
        description: Minimum host free space before and after the run in MiB
        required: true
        type: string

permissions:
  contents: read

# Five-million-row runs share fixed local service ports and are intentionally
# expensive. Never cancel an in-flight acceptance run or overlap two of them.
concurrency:
  group: brerc-loader-scale-acceptance-global
  cancel-in-progress: false

jobs:
  validate:
    name: Validate explicit scale-run confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject an absent or incorrect cost confirmation
        env:
          SCALE_CONFIRMATION: ${{ inputs.confirm }}
        run: test "${SCALE_CONFIRMATION}" = 'RUN_EXACTLY_5000000_SYNTHETIC_ROWS'
      - name: Bind the run to the exact protected-main merge
        env:
          EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
          WORKFLOW_GIT_SHA: ${{ github.sha }}
          WORKFLOW_GIT_REF: ${{ github.ref }}
        run: |
          test "${WORKFLOW_GIT_REF}" = 'refs/heads/main'
          test "${EXPECTED_GIT_SHA}" = "${WORKFLOW_GIT_SHA}"
          printf '%s' "${EXPECTED_GIT_SHA}" | grep -Eq '^[0-9a-f]{40}$'
      - name: Reject missing, non-finite, or non-positive budgets before provisioning
        env:
          MAX_TOTAL_SECONDS: ${{ inputs.max_total_seconds }}
          MAX_FINALIZE_SECONDS: ${{ inputs.max_finalize_seconds }}
          MAX_ACTIVATE_SECONDS: ${{ inputs.max_activate_seconds }}
          MAX_CLEANUP_SECONDS: ${{ inputs.max_cleanup_seconds }}
          MAX_RSS_MIB: ${{ inputs.max_rss_mib }}
          MAX_SOURCE_TEMP_MIB: ${{ inputs.max_source_temp_mib }}
          MAX_TARGET_TEMP_MIB: ${{ inputs.max_target_temp_mib }}
          MAX_TARGET_WAL_MIB: ${{ inputs.max_target_wal_mib }}
          MAX_TARGET_DB_GROWTH_MIB: ${{ inputs.max_target_db_growth_mib }}
          MIN_FREE_DISK_MIB: ${{ inputs.min_free_disk_mib }}
        run: |
          python3 - <<'PY'
          import math
          import os
          import sys

          names = (
              "MAX_TOTAL_SECONDS",
              "MAX_FINALIZE_SECONDS",
              "MAX_ACTIVATE_SECONDS",
              "MAX_CLEANUP_SECONDS",
              "MAX_RSS_MIB",
              "MAX_SOURCE_TEMP_MIB",
              "MAX_TARGET_TEMP_MIB",
              "MAX_TARGET_WAL_MIB",
              "MAX_TARGET_DB_GROWTH_MIB",
              "MIN_FREE_DISK_MIB",
          )
          try:
              values = {name: float(os.environ[name]) for name in names}
              valid = all(
                  math.isfinite(value) and value > 0 for value in values.values()
              ) and 60 <= values["MAX_TOTAL_SECONDS"] <= 18000
          except Exception:
              valid = False
          if not valid:
              print("SCALE_INPUT_INVALID")
              sys.exit(2)
          PY

  scale:
    name: Synthetic 5M source-to-publication acceptance
    needs: validate
    environment: brerc-scale-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      sourcepg:
        image: >-
          postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: brerc_loader_source_e2e
          POSTGRES_PASSWORD: synthetic-source-admin-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname brerc_loader_source_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 60
      postgis:
        image: >-
          postgis/postgis:16-3.5@sha256:cfbd2d2a5ecded5af7afaad719fa2117096f59ac8d0d9430e157eeffcd82da2e
        env:
          POSTGRES_DB: brerc_ui_integration
          POSTGRES_PASSWORD: synthetic-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname brerc_ui_integration"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 60
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Require operator-approved free-space headroom
        env:
          MIN_FREE_DISK_MIB: ${{ inputs.min_free_disk_mib }}
        run: >-
          python -c
          "import os, shutil;
          required=float(os.environ['MIN_FREE_DISK_MIB']);
          available=shutil.disk_usage('.').free/1048576;
          assert required > 0 and available >= required"
      - name: Install the pinned PostgreSQL/YAML adapter
        run: python -m pip install --disable-pip-version-check ".[connector-binary]"
      - name: Provision the deterministic 5M-row TLS source
        env:
          SOURCE_CONTAINER: ${{ job.services.sourcepg.id }}
        run: |
          bash loader_tests/setup_postgres16_e2e_source.sh \
            "${SOURCE_CONTAINER}" \
            loader_tests/postgres16_scale_source_fixture.sql \
            "${RUNNER_TEMP}/brerc-loader-scale-source" \
            55432
      - name: Provision the pinned TLS PostGIS destination
        env:
          POSTGIS_CONTAINER: ${{ job.services.postgis.id }}
        run: |
          bash loader_tests/setup_postgis16_destination.sh \
            "${POSTGIS_CONTAINER}" \
            ../db/roles.sql \
            ../db/migrations/0001_publication_store.sql \
            ../db/migrations/0002_sensitive_record_action.sql \
            ../db/migrations/0003_full_snapshot_refresh.sql \
            loader_tests/postgis16_destination_fixture.sql \
            "${RUNNER_TEMP}/brerc-loader-scale-target"
      - name: Execute the fail-closed scale acceptance
        env:
          BRERC_LOADER_SCALE_ACCEPTANCE: ${{ inputs.confirm }}
          MAX_TOTAL_SECONDS: ${{ inputs.max_total_seconds }}
          MAX_FINALIZE_SECONDS: ${{ inputs.max_finalize_seconds }}
          MAX_ACTIVATE_SECONDS: ${{ inputs.max_activate_seconds }}
          MAX_CLEANUP_SECONDS: ${{ inputs.max_cleanup_seconds }}
          MAX_RSS_MIB: ${{ inputs.max_rss_mib }}
          MAX_SOURCE_TEMP_MIB: ${{ inputs.max_source_temp_mib }}
          MAX_TARGET_TEMP_MIB: ${{ inputs.max_target_temp_mib }}
          MAX_TARGET_WAL_MIB: ${{ inputs.max_target_wal_mib }}
          MAX_TARGET_DB_GROWTH_MIB: ${{ inputs.max_target_db_growth_mib }}
          MIN_FREE_DISK_MIB: ${{ inputs.min_free_disk_mib }}
        run: |
          python scripts/run_loader_scale_acceptance.py \
            --confirm "${BRERC_LOADER_SCALE_ACCEPTANCE}" \
            --evidence-out "${RUNNER_TEMP}/brerc-loader-scale-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            --max-total-seconds "${MAX_TOTAL_SECONDS}" \
            --max-finalize-seconds "${MAX_FINALIZE_SECONDS}" \
            --max-activate-seconds "${MAX_ACTIVATE_SECONDS}" \
            --max-cleanup-seconds "${MAX_CLEANUP_SECONDS}" \
            --max-rss-mib "${MAX_RSS_MIB}" \
            --max-source-temp-mib "${MAX_SOURCE_TEMP_MIB}" \
            --max-target-temp-mib "${MAX_TARGET_TEMP_MIB}" \
            --max-target-wal-mib "${MAX_TARGET_WAL_MIB}" \
            --max-target-db-growth-mib "${MAX_TARGET_DB_GROWTH_MIB}" \
            --min-free-disk-mib "${MIN_FREE_DISK_MIB}"
      - name: Retain the canonical aggregate-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brerc-loader-scale-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brerc-loader-scale-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
