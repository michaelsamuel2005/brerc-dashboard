name: API CI

on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-guard:
    name: No client data, credentials or controlled evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Test the tracked-file guard
        run: python -m unittest scripts.test_guard_no_data_files
      - name: Reject tracked client data and source secrets
        run: python scripts/guard_no_data_files.py --repo-root .

  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test the import guard
        run: python -m unittest scripts.test_guard_stdlib_only
      - name: Enforce this Python version's standard-library boundary
        run: python scripts/guard_stdlib_only.py
      - name: Run package-aware unit tests
        run: python -m unittest discover --start-directory tests --top-level-directory . --pattern "test_*.py"
      - name: Check the browser contract fixture
        run: python scripts/generate_browser_contract_fixture.py --check ../contracts/etl-browser-contract-fixture.json

  connector:
    name: Trusted source connector (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned connector adapter
        run: python -m pip install --disable-pip-version-check ".[connector-binary]"
      - name: Run trusted connector tests
        run: python -m unittest discover --start-directory connector_tests --top-level-directory . --pattern "test_*.py"
      - name: Confirm the ETL core stayed standard-library-only
        run: python scripts/guard_stdlib_only.py

  loader-unit:
    name: Atomic release loader (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned PostgreSQL and YAML adapter
        run: python -m pip install --disable-pip-version-check ".[connector-binary]"
      - name: Run release-loader unit and static migration tests
        run: >-
          python -m unittest discover
          --start-directory loader_tests
          --top-level-directory .
          --pattern "test_*.py"
      - name: Confirm the ETL core stayed standard-library-only
        run: python scripts/guard_stdlib_only.py

  postgres-integration:
    name: PostgreSQL 16 TLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: >-
          postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: brerc_connector
          POSTGRES_PASSWORD: synthetic-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname brerc_connector"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the pinned connector adapter
        run: python -m pip install --disable-pip-version-check ".[connector-binary]"
      - name: Provision synthetic TLS source and read-only roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash connector_tests/setup_postgres16_tls.sh \
            "${POSTGRES_CONTAINER}" \
            connector_tests/postgres16_fixture.sql \
            "${RUNNER_TEMP}/brerc-postgres16-tls"
      - name: Run real Psycopg/PostgreSQL integration
        run: >-
          python -m unittest
          connector_tests.test_postgres16_integration

  postgis-loader-integration:
    name: PostgreSQL 16/PostGIS atomic loader integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sourcepg:
        image: >-
          postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: brerc_loader_source_e2e
          POSTGRES_PASSWORD: synthetic-source-admin-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname brerc_loader_source_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      postgis:
        image: >-
          postgis/postgis:16-3.5@sha256:cfbd2d2a5ecded5af7afaad719fa2117096f59ac8d0d9430e157eeffcd82da2e
        env:
          POSTGRES_DB: brerc_ui_integration
          POSTGRES_PASSWORD: synthetic-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname brerc_ui_integration"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the pinned PostgreSQL and YAML adapter
        run: python -m pip install --disable-pip-version-check ".[connector-binary]"
      - name: Provision the separate synthetic TLS source
        env:
          SOURCE_CONTAINER: ${{ job.services.sourcepg.id }}
        run: |
          bash loader_tests/setup_postgres16_e2e_source.sh \
            "${SOURCE_CONTAINER}" \
            loader_tests/postgres16_e2e_source_fixture.sql \
            "${RUNNER_TEMP}/brerc-postgres16-loader-source" \
            55432
      - name: Provision TLS, reviewed roles and migration
        env:
          POSTGIS_CONTAINER: ${{ job.services.postgis.id }}
        run: |
          bash loader_tests/setup_postgis16_destination.sh \
            "${POSTGIS_CONTAINER}" \
            ../db/roles.sql \
            ../db/migrations/0001_publication_store.sql \
            loader_tests/postgis16_destination_fixture.sql \
            "${RUNNER_TEMP}/brerc-postgis16-destination"
      - name: Run the real atomic destination lifecycle
        run: >-
          python -m unittest
          loader_tests.test_postgis16_destination_integration

      # The read-only public API, against the database the loader just published to.
      #
      # These 22 tests existed on this branch for weeks without any workflow running
      # them, which meant the API's safety properties — that its session cannot write,
      # that it reads only the reviewed serve.* relations, that it omits a field rather
      # than inventing one the release withheld — were asserted and never demonstrated.
      # They run here rather than in their own job because they need what this job has
      # already built: the migration, the reviewed roles, and an activated release.
      - name: Install the pinned API adapter
        run: python -m pip install --disable-pip-version-check ".[api]" httpx

      # The step above depends on the lifecycle tests leaving a release active. That is
      # an ordering assumption, so it is asserted rather than trusted: without a release
      # every endpoint correctly answers 503, and a suite that only ever saw 503 would
      # pass nothing while looking green.
      - name: Confirm an active release exists for the API to serve
        env:
          PGPASSWORD: synthetic-admin-password
        run: |
          ACTIVE=$(psql -h 127.0.0.1 -p 5432 -U postgres -d brerc_ui_integration -tAc \
            "SELECT count(*) FROM serve.public_release")
          echo "active releases: ${ACTIVE}"
          if [ "${ACTIVE}" != "1" ]; then
            echo "::error::The API contract tests need exactly one active release; found ${ACTIVE}."
            echo "Add an explicit activation step before this one."
            exit 1
          fi

      - name: Run the public API contract tests against the read-only role
        env:
          BRERC_API_INTEGRATION: "1"
          APP_ENV: dev
          DATABASE_URL: >-
            postgresql://brerc_api_test:synthetic-api-password@127.0.0.1:5432/brerc_ui_integration
        run: python -m unittest app_tests.test_public_api_contract

  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned development tools from package metadata
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  wheel:
    name: Build and import wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned build frontend
        run: python -m pip install --disable-pip-version-check "build==1.2.2.post1"
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel into a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/brerc-api-wheel-smoke"
          "${RUNNER_TEMP}/brerc-api-wheel-smoke/bin/python" -m pip install \
            --disable-pip-version-check --no-index --no-deps dist/*.whl
      - name: Import installed package outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/brerc-api-wheel-smoke/bin/python" -I \
            "${GITHUB_WORKSPACE}/api/scripts/smoke_installed_package.py" \
            --source-root "${GITHUB_WORKSPACE}/api"
          "${RUNNER_TEMP}/brerc-api-wheel-smoke/bin/brerc-source" --help
          "${RUNNER_TEMP}/brerc-api-wheel-smoke/bin/brerc-load" --help
      - name: Install connector dependencies and import the adapter from the wheel
        run: |
          "${RUNNER_TEMP}/brerc-api-wheel-smoke/bin/python" -m pip install \
            --disable-pip-version-check "psycopg[binary]==3.3.4" "PyYAML==6.0.3"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/brerc-api-wheel-smoke/bin/python" -I -c \
            "import brerc_source, yaml, psycopg; assert brerc_source.load_source_config"
