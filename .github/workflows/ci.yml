# Continuous Integration for the whole BRERC dashboard — backend AND front end.
#
# GitHub runs this automatically on every push and pull request. Nine jobs cover
# repository safety, the connector/loader/publication lifecycle, and the UI:
#
#   data/connector/loader jobs — reject unsafe repository state, test TLS source
#                access, and exercise an atomic synthetic PostGIS publication.
#   api-tests  — keeps the legacy ETL and database safety suites mandatory.
#   verify     — front-end typecheck, lint, guard, unit tests and build.
#   e2e        — front-end end-to-end + accessibility tests in a real browser.
#
# NOTE ON THE PATH FILTER: this workflow deliberately has NO `paths:` filter, so
# every job runs on every change. The previous front-end-only version filtered on
# "web/**", which meant a change to the database schema or the API ran no checks
# at all — that is how a broken db/b6_sample_data.sql sat on main unnoticed. A
# few extra CI minutes is a fair price for that not happening again.
#
# Nothing here touches real BRERC data; it uses the invented sample rows only.
#
# You don't run this file yourself — push your branch and watch the "Actions" tab
# on GitHub. A green tick means everything passed.

name: CI

on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # REPOSITORY SAFETY — no client extracts, credentials or controlled evidence
  # ---------------------------------------------------------------------------
  data-guard:
    name: No client data, credentials or controlled evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test the tracked-file guard
        run: >-
          python -m unittest
          scripts.test_guard_no_data_files
          scripts.test_guard_workflow_dependencies
      - name: Reject tracked client data and source secrets
        run: python scripts/guard_no_data_files.py --repo-root .
      - name: Smoke-test every workflow's repository dependencies
        run: python scripts/guard_workflow_dependencies.py --repo-root .

  # ---------------------------------------------------------------------------
  # TRUSTED SOURCE — unit tests and a real PostgreSQL 16/TLS boundary test
  # ---------------------------------------------------------------------------
  connector-tests:
    name: Trusted source connector (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned connector adapter
        run: python -m pip install --disable-pip-version-check ".[connector-binary]"
      - name: Run trusted connector tests
        run: >-
          python -m unittest discover --start-directory connector_tests
          --top-level-directory . --pattern "test_*.py"
      - name: Confirm the publication core stayed standard-library-only
        run: python scripts/guard_stdlib_only.py

  source-postgres-integration:
    name: PostgreSQL 16 TLS source integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: brerc_connector
          POSTGRES_PASSWORD: synthetic-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname brerc_connector"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned connector adapter
        run: python -m pip install --disable-pip-version-check ".[connector-binary]"
      - name: Provision synthetic TLS source and read-only roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash connector_tests/setup_postgres16_tls.sh \
            "${POSTGRES_CONTAINER}" \
            connector_tests/postgres16_fixture.sql \
            "${RUNNER_TEMP}/brerc-postgres16-tls"
      - name: Run real Psycopg/PostgreSQL integration
        run: python -m unittest connector_tests.test_postgres16_integration

  connector-package:
    name: Connector Ruff and wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned API, build and lint tools
        run: >-
          python -m pip install --disable-pip-version-check
          ".[api]" "build==1.2.2.post1" "pytest==8.4.2" "ruff==0.12.0"
      - name: Lint and format the connector and loader ports
        run: |
          python -m ruff check \
            brerc_source connector_tests brerc_loader loader_tests \
            etl/streaming.py tests/test_streaming.py \
            scripts/run_loader_scale_acceptance.py scripts/smoke_installed_package.py
          python -m ruff format --check \
            brerc_source connector_tests brerc_loader loader_tests \
            etl/streaming.py tests/test_streaming.py \
            scripts/run_loader_scale_acceptance.py scripts/smoke_installed_package.py
          # species_info.py is Ting Ting's retained, superseded outbound proxy.
          # The publication API does not call it; preserve its authorship while
          # linting every other app module and recording only its four existing
          # findings as narrow CLI waivers.
          python -m ruff check app app_tests package_tests \
            --per-file-ignores 'app/species_info.py:S105' \
            --per-file-ignores 'app/species_info.py:E731' \
            --per-file-ignores 'app/species_info.py:S110' \
            --per-file-ignores 'app/species_info.py:S608'
          python -m ruff format --check app app_tests package_tests \
            --exclude app/species_info.py
      - name: Test the isolated API package and container boundary
        run: python -m pytest package_tests -q
      - name: Build the combined repository wheel
        run: python -m build --wheel
      - name: Install the wheel without source-tree fallback
        run: |
          python -m venv "${RUNNER_TEMP}/brerc-wheel-smoke"
          "${RUNNER_TEMP}/brerc-wheel-smoke/bin/python" -m pip install \
            --disable-pip-version-check --no-index --no-deps dist/*.whl
      - name: Smoke the installed publication and connector boundary
        working-directory: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/brerc-wheel-smoke/bin/python" -I \
            "${GITHUB_WORKSPACE}/api/scripts/smoke_installed_package.py" \
            --source-root "${GITHUB_WORKSPACE}/api"
          "${RUNNER_TEMP}/brerc-wheel-smoke/bin/brerc-source" --help
          "${RUNNER_TEMP}/brerc-wheel-smoke/bin/brerc-load" --help

  loader-unit:
    name: Atomic release loader (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned PostgreSQL and YAML adapter
        run: python -m pip install --disable-pip-version-check ".[connector-binary]"
      - name: Run release-loader unit and static migration tests
        run: >-
          python -m unittest discover
          --start-directory loader_tests
          --top-level-directory .
          --pattern "test_*.py"
      - name: Confirm the publication core stayed standard-library-only
        run: python scripts/guard_stdlib_only.py

  postgis-loader-integration:
    name: PostgreSQL 16/PostGIS atomic loader integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      sourcepg:
        image: >-
          postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: brerc_loader_source_e2e
          POSTGRES_PASSWORD: synthetic-source-admin-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname brerc_loader_source_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      postgis:
        image: >-
          postgis/postgis:16-3.5@sha256:cfbd2d2a5ecded5af7afaad719fa2117096f59ac8d0d9430e157eeffcd82da2e
        env:
          POSTGRES_DB: brerc_ui_integration
          POSTGRES_PASSWORD: synthetic-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname brerc_ui_integration"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned loader, public API and test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          ".[connector-binary,api]" "pytest==8.4.2"
      - name: Provision the separate synthetic TLS source
        env:
          SOURCE_CONTAINER: ${{ job.services.sourcepg.id }}
        run: |
          bash loader_tests/setup_postgres16_e2e_source.sh \
            "${SOURCE_CONTAINER}" \
            loader_tests/postgres16_e2e_source_fixture.sql \
            "${RUNNER_TEMP}/brerc-postgres16-loader-source" \
            55432
      - name: Provision TLS, reviewed roles and publication migration
        env:
          POSTGIS_CONTAINER: ${{ job.services.postgis.id }}
        run: |
          bash loader_tests/setup_postgis16_destination.sh \
            "${POSTGIS_CONTAINER}" \
            ../db/roles.sql \
            ../db/migrations/0001_publication_store.sql \
            ../db/migrations/0002_sensitive_record_action.sql \
            loader_tests/postgis16_destination_fixture.sql \
            "${RUNNER_TEMP}/brerc-postgis16-destination"
      - name: Run the real atomic destination lifecycle
        run: >-
          python -m unittest
          loader_tests.test_postgis16_destination_integration
      - name: Publish one clean release for the API acceptance boundary
        # The lifecycle suite deliberately creates, corrupts and removes many
        # candidates. Its setUp truncates state before each case. Re-running the
        # single successful end-to-end publication test LAST leaves exactly one
        # active synthetic release for the read-only API checks below.
        run: >-
          python -m unittest
          loader_tests.test_postgis16_destination_integration.TestPostGIS16DestinationIntegration.test_real_source_connector_streams_into_one_atomic_public_release
      - name: Run the complete API suite against the active TLS release
        env:
          APP_ENV: prod
          BRERC_API_INTEGRATION: "1"
          DATABASE_URL: >-
            postgresql://brerc_api_test:synthetic-api-password@localhost:5432/brerc_ui_integration?sslmode=verify-full&sslrootcert=${{ runner.temp }}/brerc-postgis16-destination/ca.crt
          BRERC_LOADER_TEST_DATABASE_URL: >-
            postgresql://brerc_release_loader_test:synthetic-loader-password@localhost:5432/brerc_ui_integration?sslmode=verify-full&sslrootcert=${{ runner.temp }}/brerc-postgis16-destination/ca.crt
        run: |
          python - <<'PY'
          import os

          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT count(*) FROM serve.public_release")
                  active_releases = cursor.fetchone()[0]
          if active_releases != 1:
              raise SystemExit(
                  f"expected exactly one active synthetic release, observed {active_releases}"
              )
          PY
          python -m pytest app_tests -q
      # Run the browser against the exact safe-v1 release left active above:
      # one ordinary public row and the sensitive synthetic row withheld.
      # The preview proxy keeps browser requests same-origin while Uvicorn still
      # connects as the restricted brerc_api role over verify-full TLS.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the live browser test runtime
        working-directory: web
        run: npm ci
      - name: Install Chromium for the live publication acceptance
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build the mocks-disabled production web application
        working-directory: web
        run: |
          npm run build
          npm run guard:bundle
      - name: Run the mocks-disabled browser acceptance
        working-directory: web
        env:
          APP_ENV: prod
          DATABASE_URL: >-
            postgresql://brerc_api_test:synthetic-api-password@localhost:5432/brerc_ui_integration?sslmode=verify-full&sslrootcert=${{ runner.temp }}/brerc-postgis16-destination/ca.crt
          BRERC_LOCAL_API: http://127.0.0.1:8000
          LIVE_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail

          diagnostics="${RUNNER_TEMP}/brerc-live-diagnostics"
          mkdir -p "${diagnostics}"
          api_pid=""
          preview_pid=""

          cleanup() {
            set +e
            for pid in "${preview_pid}" "${api_pid}"; do
              if [[ -n "${pid}" ]] && kill -0 "${pid}" 2>/dev/null; then
                kill "${pid}"
              fi
            done
            [[ -n "${preview_pid}" ]] && wait "${preview_pid}" 2>/dev/null
            [[ -n "${api_pid}" ]] && wait "${api_pid}" 2>/dev/null
          }
          trap cleanup EXIT

          wait_for_url() {
            local label="$1"
            local url="$2"
            local pid="$3"
            local log_file="$4"
            for attempt in {1..60}; do
              if curl --fail --silent --show-error "${url}" >/dev/null; then
                return 0
              fi
              if ! kill -0 "${pid}" 2>/dev/null; then
                echo "${label} exited before it became ready" >&2
                tail -n 100 "${log_file}" >&2 || true
                return 1
              fi
              sleep 1
            done
            echo "${label} did not become ready within 60 seconds" >&2
            tail -n 100 "${log_file}" >&2 || true
            return 1
          }

          (
            cd "${GITHUB_WORKSPACE}/api"
            exec python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
          ) >"${diagnostics}/uvicorn.log" 2>&1 &
          api_pid=$!
          wait_for_url \
            "Uvicorn" \
            "http://127.0.0.1:8000/api/summary" \
            "${api_pid}" \
            "${diagnostics}/uvicorn.log"

          (
            cd "${GITHUB_WORKSPACE}/web"
            exec npm run preview -- --host 127.0.0.1 --port 4173
          ) >"${diagnostics}/vite-preview.log" 2>&1 &
          preview_pid=$!
          wait_for_url \
            "Vite preview" \
            "http://127.0.0.1:4173/" \
            "${preview_pid}" \
            "${diagnostics}/vite-preview.log"
          wait_for_url \
            "Vite API proxy" \
            "http://127.0.0.1:4173/api/summary" \
            "${preview_pid}" \
            "${diagnostics}/vite-preview.log"

          npx --no-install playwright test --config playwright.live.config.ts
      - name: Upload live publication browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-publication-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/brerc-live-diagnostics
            web/test-results
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # BACKEND — API + database safety boundary
  # ---------------------------------------------------------------------------
  api-tests:
    name: API tests (with sample PostGIS database)
    runs-on: ubuntu-latest

    # Run every step from inside the api/ folder (that's where the app lives).
    defaults:
      run:
        working-directory: api

    # A disposable PostGIS database, created fresh for this run and thrown away
    # after. Nothing real ever lives here.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brerc_ui
        ports:
          - 5432:5432
        # Wait until the database is actually ready before the job starts.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The API and the tests read this. Same shape as your local .env, pointing
      # at the throwaway database above.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brerc_ui
      # The ETL deliberately never reuses the public API variable. These two
      # explicit names point to the same disposable CI database, while real
      # deployments use separate least-privilege write and admin roles.
      DESTINATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brerc_ui
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/brerc_ui
      # Explicitly off, so CI can never reach out to iNaturalist/GBIF/Wikipedia.
      # The B8 proxy tests use a fake HTTP transport and stay offline either way;
      # this makes that guarantee visible rather than relying on the default.
      SPECIES_INFO_ENABLED: "false"

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Load the sample databases (B0 + B6)
        # -v ON_ERROR_STOP=1 matters more than it looks. Without it, psql prints
        # a SQL error and carries on with exit code 0 — so this step goes GREEN
        # even when nothing loaded, and you find out three steps later as a pile
        # of confusing test failures instead of the actual error.
        #
        # This has bitten us three times: a NOT NULL column was added to the
        # schema (content_hash, then "Load"/"Load_date", then date_mdb_modified)
        # without db/b6_sample_data.sql being updated to match. With this flag,
        # the run fails HERE, quoting the exact column.
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f ../db/b0_staging_setup.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f ../db/b6_schema.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f ../db/b6_sample_data.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f ../db/b7_tiles.sql

      - name: Run the legacy API and B6 safety tests
        # Preserve every legacy ETL/B6 safety check. Exclude only these four
        # endpoint/proxy modules: they target the superseded B0/B8 database and
        # outbound-media contracts. app_tests now replaces them against the
        # atomic publication store and its dedicated read-only TLS role.
        run: >-
          python -m pytest tests -q
          --ignore=tests/test_b0_integration.py
          --ignore=tests/test_b8_query_params.py
          --ignore=tests/test_b8_species_info.py
          --ignore=tests/test_smoke.py

      # The ETL suite (etl/, B1-B5) was excluded with "add them here once they
      # run standalone". They do run standalone — no network, and the database
      # this job already stands up is exactly what the integration tests need.
      #
      # Leaving them out was not a small gap. It meant the safety gate — the
      # code that decides how coarse a protected species' location is before it
      # reaches the public map — had NO automated coverage on any run, and its
      # four database-backed generalisation tests skipped silently on every
      # machine without PostGIS. The properties we most need to be true were
      # the only ones nothing checked.
      #
      # Runs as its own step so a failure says which suite broke, and after the
      # API tests because the ETL integration tests reconcile against the shared
      # sample data and re-seed it afterwards.
      - name: Run the ETL and safety-gate tests
        run: python -m pytest etl/tests -q

      - name: Guard the publication safety boundary
        run: |
          python -m unittest scripts.test_guard_stdlib_only
          python scripts/guard_stdlib_only.py
          python scripts/generate_browser_contract_fixture.py \
            --check ../contracts/etl-browser-contract-fixture.json

  # ---------------------------------------------------------------------------
  # FRONT END — typecheck, lint, unit tests, build
  # ---------------------------------------------------------------------------
  verify:
    name: Front-end checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-node v7 runs the action itself on Node 24. The application stays
      # on its supported Node 20 runtime until that separate upgrade is agreed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run guard
      - run: npm run test:run
      - run: npm run build
      - run: npm run guard:bundle

  # ---------------------------------------------------------------------------
  # FRONT END — end-to-end + accessibility (WCAG 2.2 AA is a legal requirement)
  # ---------------------------------------------------------------------------
  e2e:
    name: Front-end end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep the application runtime aligned with the verification job above;
      # only the GitHub Action implementation moves to Node 24 here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Chromium, Firefox and WebKit
        run: npm run e2e:install
      - name: Check browser contract serialization
        run: npm run e2e:serialization
      - name: Run the complete multi-project browser suite
        run: xvfb-run --auto-servernum npm run e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: warn
          retention-days: 14
