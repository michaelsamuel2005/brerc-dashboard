# Continuous Integration for the whole BRERC dashboard — backend AND front end.
#
# GitHub runs this automatically on every push and pull request. Three jobs run
# in parallel:
#
#   api-tests  — stands up a throwaway PostGIS database, loads the invented
#                sample rows, and runs the Python test suite (the contract-shape
#                tests AND the safety-boundary tests: no recorder names, no
#                precise coordinates, sensitive rows blurred).
#   verify     — front-end typecheck, lint, guard, unit tests and build.
#   e2e        — front-end end-to-end + accessibility tests in a real browser.
#
# NOTE ON THE PATH FILTER: this workflow deliberately has NO `paths:` filter, so
# every job runs on every change. The previous front-end-only version filtered on
# "web/**", which meant a change to the database schema or the API ran no checks
# at all — that is how a broken db/b6_sample_data.sql sat on main unnoticed. A
# few extra CI minutes is a fair price for that not happening again.
#
# Nothing here touches real BRERC data; it uses the invented sample rows only.
#
# You don't run this file yourself — push your branch and watch the "Actions" tab
# on GitHub. A green tick means everything passed.

name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # BACKEND — API + database safety boundary
  # ---------------------------------------------------------------------------
  api-tests:
    name: API tests (with sample PostGIS database)
    runs-on: ubuntu-latest

    # Run every step from inside the api/ folder (that's where the app lives).
    defaults:
      run:
        working-directory: api

    # A disposable PostGIS database, created fresh for this run and thrown away
    # after. Nothing real ever lives here.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brerc_ui
        ports:
          - 5432:5432
        # Wait until the database is actually ready before the job starts.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The API and the tests read this. Same shape as your local .env, pointing
      # at the throwaway database above.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brerc_ui
      # The ETL deliberately never reuses the public API variable. These two
      # explicit names point to the same disposable CI database, while real
      # deployments use separate least-privilege write and admin roles.
      DESTINATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brerc_ui
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/brerc_ui
      # Explicitly off, so CI can never reach out to iNaturalist/GBIF/Wikipedia.
      # The B8 proxy tests use a fake HTTP transport and stay offline either way;
      # this makes that guarantee visible rather than relying on the default.
      SPECIES_INFO_ENABLED: "false"

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Load the sample databases (B0 + B6)
        # -v ON_ERROR_STOP=1 matters more than it looks. Without it, psql prints
        # a SQL error and carries on with exit code 0 — so this step goes GREEN
        # even when nothing loaded, and you find out three steps later as a pile
        # of confusing test failures instead of the actual error.
        #
        # This has bitten us three times: a NOT NULL column was added to the
        # schema (content_hash, then "Load"/"Load_date", then date_mdb_modified)
        # without db/b6_sample_data.sql being updated to match. With this flag,
        # the run fails HERE, quoting the exact column.
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f ../db/b0_staging_setup.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f ../db/b6_schema.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f ../db/b6_sample_data.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f ../db/b7_tiles.sql

      - name: Run the API tests
        # The API test suite (this backend workstream, B0/B6-B9).
        run: python -m pytest tests -q

      # The ETL suite (etl/, B1-B5) was excluded with "add them here once they
      # run standalone". They do run standalone — no network, and the database
      # this job already stands up is exactly what the integration tests need.
      #
      # Leaving them out was not a small gap. It meant the safety gate — the
      # code that decides how coarse a protected species' location is before it
      # reaches the public map — had NO automated coverage on any run, and its
      # four database-backed generalisation tests skipped silently on every
      # machine without PostGIS. The properties we most need to be true were
      # the only ones nothing checked.
      #
      # Runs as its own step so a failure says which suite broke, and after the
      # API tests because the ETL integration tests reconcile against the shared
      # sample data and re-seed it afterwards.
      - name: Run the ETL and safety-gate tests
        run: python -m pytest etl/tests -q

      - name: Guard the publication safety boundary
        run: |
          python -m unittest scripts.test_guard_stdlib_only
          python scripts/guard_stdlib_only.py
          python scripts/generate_browser_contract_fixture.py \
            --check ../contracts/etl-browser-contract-fixture.json

  # ---------------------------------------------------------------------------
  # FRONT END — typecheck, lint, unit tests, build
  # ---------------------------------------------------------------------------
  verify:
    name: Front-end checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-node v7 runs the action itself on Node 24. The application stays
      # on its supported Node 20 runtime until that separate upgrade is agreed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run guard
      - run: npm run test:run
      - run: npm run build

  # ---------------------------------------------------------------------------
  # FRONT END — end-to-end + accessibility (WCAG 2.2 AA is a legal requirement)
  # ---------------------------------------------------------------------------
  e2e:
    name: Front-end end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep the application runtime aligned with the verification job above;
      # only the GitHub Action implementation moves to Node 24 here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
