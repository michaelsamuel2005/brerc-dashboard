name: web CI
on:
  push:
    paths: ["web/**", "api/**", "contracts/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["web/**", "api/**", "contracts/**", ".github/workflows/ci.yml"]
permissions:
  contents: read
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run guard
      - run: npm run test:run
      - run: npm run build
      # Must follow build: reads dist/ and fails if the MSW mock layer was
      # bundled into the public app. See web/scripts/guard-bundle.mjs.
      - run: npm run guard:bundle
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run e2e:install
      - run: npm run e2e:serialization
      # xvfb-run: the Firefox project runs HEADED on CI (see e2e/playwright.viewports.ts)
      # because headless Firefox on a GPU-less Linux runner cannot create a WebGL
      # context, so the map never renders. Xvfb gives it a display; Chromium and WebKit
      # stay headless inside it and are unaffected.
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run e2e
      - name: Upload accessibility evidence and Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brerc-a11y-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            web/test-results/
            web/playwright-report/
