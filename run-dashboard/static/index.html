<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BRERC ETL Run History</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e1e4e8;
    --text: #1f2328;
    --muted: #6b7280;
    --running: #b45309;
    --running-bg: #fef3c7;
    --successful: #15803d;
    --successful-bg: #dcfce7;
    --failed: #b91c1c;
    --failed-bg: #fee2e2;
    --mono-bg: #f0f1f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --panel: #161a20;
      --border: #2a2f38;
      --text: #e6e8eb;
      --muted: #9aa2ad;
      --running-bg: #3a2c0d;
      --successful-bg: #0f2e1c;
      --failed-bg: #3a1414;
      --mono-bg: #1d222a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 1320px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  h1 {
    font-size: 1.375rem;
    margin: 0 0 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.875rem;
    margin: 0 0 1.5rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }
  th, td {
    text-align: left;
    vertical-align: middle;
    padding: 0.65rem 1rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tbody tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.75rem;
  }
  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .badge.running { color: var(--running); background: var(--running-bg); }
  .badge.successful { color: var(--successful); background: var(--successful-bg); }
  .badge.failed { color: var(--failed); background: var(--failed-bg); }
  .badge.cancelled { color: var(--failed); background: var(--failed-bg); }
  .reason {
    max-width: 480px;
    white-space: normal;
    color: var(--failed);
  }
  .reason details {
    margin-top: 0.35rem;
  }
  .reason summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 600;
  }
  .reason summary:hover { color: var(--text); }
  .reason code {
    display: block;
    margin-top: 0.35rem;
    padding: 0.5rem 0.6rem;
    border-radius: 6px;
    background: var(--mono-bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.75rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  tr.expandable { cursor: pointer; }
  tr.expandable:hover td { background: rgba(127, 127, 127, 0.06); }
  .hover-hint {
    display: none;
    color: var(--muted);
    font-style: italic;
  }
  tr.expandable:hover .dash { display: none; }
  tr.expandable:hover .hover-hint { display: inline; }
  tr.detail-row td {
    background: var(--bg);
    padding: 0.5rem 1rem 0.85rem;
    font-size: 0.8125rem;
    color: var(--muted);
  }
  tr.detail-row.hidden { display: none; }
  .counts {
    display: flex;
    gap: 1.5rem;
    font-variant-numeric: tabular-nums;
  }
  .counts strong {
    color: var(--text);
    font-weight: 700;
  }
  .empty {
    padding: 2.5rem 1rem;
    text-align: center;
    color: var(--muted);
  }
  .meta {
    margin-top: 0.75rem;
    color: var(--muted);
    font-size: 0.75rem;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }
  .logout {
    color: var(--muted);
    font-size: 0.8125rem;
    text-decoration: none;
    white-space: nowrap;
  }
  .logout:hover { color: var(--text); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>BRERC ETL Run History</h1>
      <p class="subtitle">Authoritative status from the atomic PostgreSQL publication loader. This run list refreshes every five seconds.</p>
    </div>
    <a class="logout" href="/logout">Log out</a>
  </header>
  <div class="panel">
    <table>
      <thead>
        <tr>
          <th>Job</th>
          <th>Source</th>
          <th>Attempt</th>
          <th>Mode</th>
          <th>Started</th>
          <th>Duration</th>
          <th>Status</th>
          <th>Outcome</th>
        </tr>
      </thead>
      <tbody id="runs-body"></tbody>
    </table>
    <div id="empty-state" class="empty" hidden>No runs recorded yet.</div>
  </div>
  <p class="meta" id="last-updated"></p>
</main>

<script>
  const REFRESH_MS = 5000;
  const tbody = document.getElementById("runs-body");
  const emptyState = document.getElementById("empty-state");
  const lastUpdated = document.getElementById("last-updated");

  function formatDuration(seconds) {
    if (seconds === null || seconds === undefined) return "—";
    if (seconds < 60) return `${seconds.toFixed(2)}s`;
    const minutes = Math.floor(seconds / 60);
    const remainder = Math.round(seconds % 60).toString().padStart(2, "0");
    return `${minutes}m ${remainder}s`;
  }

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
  }

  function formatTimestamp(value) {
    if (!value) return "—";
    const parsed = new Date(value);
    return Number.isNaN(parsed.getTime()) ? "—" : parsed.toLocaleString();
  }

  function renderOutcome(run, expandable) {
    // Only a fixed failure code and its repository-owned explanation are
    // rendered. Database/server exception text is never returned by the API.
    const summary = run.failure_summary;
    if (!summary) {
      if (run.reused_active_release) return "No data change — active release reused";
      if (expandable) {
        return '<span class="dash">—</span><span class="hover-hint">Click for details</span>';
      }
      return "—";
    }

    let html = escapeHtml(summary);
    if (run.failure_code) {
      html += `<details><summary>Failure code</summary><code>${escapeHtml(run.failure_code)}</code></details>`;
    }
    return html;
  }

  // Which runs the user has expanded to see their bounded publication counts,
  // counts, kept across the 5s auto-refresh so the table doesn't collapse
  // under someone mid-read.
  const expandedRuns = new Set();

  function hasCounts(run) {
    return run.source_rows_seen !== null || run.candidate_rows !== null || run.rows_withheld !== null;
  }

  function renderCounts(run) {
    const count = (value) => (value === null || value === undefined ? 0 : value);
    return `
      <div class="counts">
        <span>Source rows <strong>${count(run.source_rows_seen)}</strong></span>
        <span>Publication basis <strong>${count(run.candidate_rows)}</strong></span>
        <span>Withheld <strong>${count(run.rows_withheld)}</strong></span>
      </div>
    `;
  }

  function renderRow(run) {
    const tr = document.createElement("tr");
    const status = (run.status || "").toLowerCase();
    const expandable = hasCounts(run);
    const isExpanded = expandable && expandedRuns.has(run.job_id);

    if (expandable) {
      tr.classList.add("expandable");
      if (isExpanded) tr.classList.add("expanded");
    }

    tr.innerHTML = `
      <td><code title="${escapeHtml(run.job_id)}">${escapeHtml(run.job_id.slice(0, 8))}</code></td>
      <td>${escapeHtml(run.source_id)}</td>
      <td>${run.attempt}</td>
      <td>${escapeHtml(run.load_mode)}</td>
      <td>${formatTimestamp(run.started_at)}</td>
      <td>${formatDuration(run.duration_seconds)}</td>
      <td><span class="badge ${status}">${escapeHtml(run.status)}</span></td>
      <td class="reason">${renderOutcome(run, expandable)}</td>
    `;

    if (!expandable) return [tr];

    const detailRow = document.createElement("tr");
    detailRow.className = `detail-row${isExpanded ? "" : " hidden"}`;
    detailRow.innerHTML = `<td colspan="8">${renderCounts(run)}</td>`;

    tr.addEventListener("click", (event) => {
      // Don't hijack clicks on the Reason column's own "Technical details"
      // toggle — only the rest of the row expands/collapses the counts.
      if (event.target.closest(".reason")) return;

      const nowExpanded = detailRow.classList.toggle("hidden") === false;
      tr.classList.toggle("expanded", nowExpanded);
      if (nowExpanded) {
        expandedRuns.add(run.job_id);
      } else {
        expandedRuns.delete(run.job_id);
      }
    });

    return [tr, detailRow];
  }

  async function loadRuns() {
    try {
      const response = await fetch("/api/runs");

      if (response.status === 401) {
        window.location.href = "/login";
        return;
      }

      if (!response.ok) throw new Error("Run history request failed");

      const runs = await response.json();
      if (!Array.isArray(runs)) throw new Error("Run history response was invalid");

      tbody.innerHTML = "";
      emptyState.hidden = runs.length > 0;
      runs.forEach((run) => renderRow(run).forEach((row) => tbody.appendChild(row)));

      lastUpdated.textContent = `Last updated ${new Date().toLocaleTimeString()}`;
    } catch (error) {
      lastUpdated.textContent = "Failed to load run history — is the server running?";
    }
  }

  loadRuns();
  setInterval(loadRuns, REFRESH_MS);
</script>
</body>
</html>
