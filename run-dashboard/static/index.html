<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BRERC ETL Run History</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e1e4e8;
    --text: #1f2328;
    --muted: #6b7280;
    --running: #b45309;
    --running-bg: #fef3c7;
    --successful: #15803d;
    --successful-bg: #dcfce7;
    --failed: #b91c1c;
    --failed-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --panel: #161a20;
      --border: #2a2f38;
      --text: #e6e8eb;
      --muted: #9aa2ad;
      --running-bg: #3a2c0d;
      --successful-bg: #0f2e1c;
      --failed-bg: #3a1414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  h1 {
    font-size: 1.375rem;
    margin: 0 0 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.875rem;
    margin: 0 0 1.5rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }
  th, td {
    text-align: left;
    padding: 0.65rem 1rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tbody tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.75rem;
  }
  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .badge.running { color: var(--running); background: var(--running-bg); }
  .badge.successful { color: var(--successful); background: var(--successful-bg); }
  .badge.failed { color: var(--failed); background: var(--failed-bg); }
  .empty {
    padding: 2.5rem 1rem;
    text-align: center;
    color: var(--muted);
  }
  .meta {
    margin-top: 0.75rem;
    color: var(--muted);
    font-size: 0.75rem;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }
  .logout {
    color: var(--muted);
    font-size: 0.8125rem;
    text-decoration: none;
    white-space: nowrap;
  }
  .logout:hover { color: var(--text); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>BRERC ETL Run History</h1>
      <p class="subtitle">Live status of every "UI etl run" pipeline run. Refreshes automatically.</p>
    </div>
    <a class="logout" href="/logout">Log out</a>
  </header>
  <div class="panel">
    <table>
      <thead>
        <tr>
          <th>Run #</th>
          <th>Job name</th>
          <th>Job type</th>
          <th>Date</th>
          <th>Load no</th>
          <th>Duration</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="runs-body"></tbody>
    </table>
    <div id="empty-state" class="empty" hidden>No runs recorded yet.</div>
  </div>
  <p class="meta" id="last-updated"></p>
</main>

<script>
  const REFRESH_MS = 5000;
  const tbody = document.getElementById("runs-body");
  const emptyState = document.getElementById("empty-state");
  const lastUpdated = document.getElementById("last-updated");

  function formatDuration(seconds) {
    if (seconds === null || seconds === undefined) return "—";
    if (seconds < 60) return `${seconds.toFixed(2)}s`;
    const minutes = Math.floor(seconds / 60);
    const remainder = Math.round(seconds % 60).toString().padStart(2, "0");
    return `${minutes}m ${remainder}s`;
  }

  function renderRow(run) {
    const tr = document.createElement("tr");
    const status = (run.status || "").toLowerCase();
    tr.innerHTML = `
      <td>${run.run_number}</td>
      <td>${run.job_name ?? ""}</td>
      <td>${run.job_type ?? ""}</td>
      <td>${run.date ?? ""}</td>
      <td>${run.load_no ?? "—"}</td>
      <td>${formatDuration(run.duration_seconds)}</td>
      <td><span class="badge ${status}">${run.status ?? ""}</span></td>
    `;
    return tr;
  }

  async function loadRuns() {
    try {
      const response = await fetch("/api/runs");

      if (response.status === 401) {
        window.location.href = "/login";
        return;
      }

      const runs = await response.json();

      tbody.innerHTML = "";
      emptyState.hidden = runs.length > 0;
      runs.forEach((run) => tbody.appendChild(renderRow(run)));

      lastUpdated.textContent = `Last updated ${new Date().toLocaleTimeString()}`;
    } catch (error) {
      lastUpdated.textContent = "Failed to load run history — is the server running?";
    }
  }

  loadRuns();
  setInterval(loadRuns, REFRESH_MS);
</script>
</body>
</html>
