<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRERC — Wildlife of the West of England</title>
    <meta
      name="description"
      content="An interactive, accessible map of the wildlife recorded across Bristol, Bath and North East Somerset, North Somerset and South Gloucestershire."
    />
    <!--
      No <link> to a font CDN. Inter and Fraunces are self-hosted and imported in
      src/main.tsx: a stylesheet link to fonts.googleapis.com would send every visitor's
      IP address to Google before a single pixel was drawn, which a public-sector site
      should not do silently, and our own Content-Security-Policy (font-src 'self' data:)
      blocks it anyway. Nothing here loads from a third party.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
